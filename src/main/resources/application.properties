spring.application.name=autosusbcali
spring.datasource.url=jdbc:postgresql://localhost:5432/servicios_db
spring.datasource.username=servicios_user
spring.datasource.password=servicios_password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Logging (SLF4J + Logback) ---
logging.level.root=INFO
logging.level.co.edu.usbcali.autosusbcali=DEBUG
# Descomentar para ver las sentencias SQL (útil al verificar el DELETE)
#logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n